# Netlify config for XGrab — Twitter Media Downloader
# Netlify natively routes / .netlify/functions/* to serverless functions
# No extra redirects needed for function calls

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
